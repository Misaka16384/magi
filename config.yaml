# ==========================================
#  Gemini Wiki Skills — 统一配置
#  所有脚本共享此文件，用户只需编辑此处。
#  优先级: 命令行参数 > 环境变量 > 本文件 > 代码默认值
# ==========================================

# Ollama 服务配置（所有使用 Ollama 的脚本共享）
ollama:
  base_url: "http://127.0.0.1:11434"

# 模型配置
models:
  # OCR 模型（pdf2md-agent 使用）
  # 可选: glm-ocr, glm-ocr-16k, qwen3-vl, qwen3-vl:4b, qwen3-vl-fast
  ocr: "glm-ocr:q8_0"
  # 嵌入模型（semantic_linker 使用）
  embedding: "qwen3-embedding:0.6b"

# 研究循环（magi next / sync --close 读这些）
research:
  # 收工闸门推得多紧：off 不拦；light 拦本会话没记下来的事；
  # strict 再加一条——命题进 testing 却没有 bet 也算欠账。
  # 写在这里而不是只写进 AGENTS.md 的协议文本：闸门读的是这个键，
  # 两处只有一处能算数，而算数的是这处。
  coaching: light
  # 一条线上同时开着几条命题算太多。超过就进决策队列问人。
  wip_limit: 3
  # 一条线多少天没动静算安静。安静不是错，只是值得被问一句。
  # 同一个数的一半，是 `magi next` 对一条开着的命题换口气的门槛：不到那天
  # 它只说"这是这条线上最老的活"，过了才说"把发现的写下来，或者挪一下"。
  # 研究的尺度是周，开了一天的命题不欠任何人。
  stall_days: 14
  # 复核跑在哪个宿主上。留空 = 探测 PATH,选一个不是作者的那个,
  # 这也是默认想要的：跨厂商是"独立"最便宜的近似。选中的那个没答上来
  # (配额、超时、崩了),自动换下一个装了的,帖子里写明换过。
  review_host:
  # 钉住复核用的模型。留空 = 用那个宿主记录里的「强档」(claude 是 opus,
  # agy 是 gemini-3.8-flash-high;codex 用它自己的默认,理由见 core/hosts.py)。
  # 2026-09-03 之前留空走的是「便宜档」——同一批命题上实测,haiku 十二次
  # 判决放过了全部四处实质错误,还报出它没读过的行号;opus 找到了唯一一处
  # 真正的证明缺口。制造信心的复核比没有复核更糟,所以默认改成会读的那个。
  # 想省就写 haiku / gemini-3.7-flash-low,帖子会记下是哪一档判的。
  #
  # 注意这是一个字符串、对所有厂商生效,而复核宿主是自动挑的——模型名各家
  # 不通用,所以要么连 review_host 一起钉住,要么把 `model:` 写在
  # research.hosts 的那条记录上(更具体的赢)。
  review_model:
  # 推理档位:low | medium | high。留空 = 强档自带的档位(claude 的 opus 配
  # high),钉了别的模型就用那家 CLI 自己的默认——模型 id 往往已经带了档位
  # (agy 的 gemini-3.8-flash-high 就是),再传一次只会多一个出错的机会。
  review_effort:
  # 复核方和它起的所有进程合起来最多占多少 MB 内存。复核方会自己写脚本自己跑,
  # 2026-09-17 有一次脚本死循环涨到 18.9 GB 把桌面拖垮。Windows 上用 Job Object
  # 强制执行,其他平台暂不强制;0 = 不设上限。
  review_memory_mb: 4096
  # (weekly_calls 已取消,2026-09-03。大家都在 token plan 上,按次数封顶的
  # 预算拦住的只有它本该保护的复核;账本 output/llm-ledger.jsonl 照记,只是
  # 不再拒绝。写在这里的 weekly_calls 不会被读。)
  # 总开关。关掉之后 review / reflect 拒绝启动,并且不会有任何东西算作已复核。
  llm_calls: true
  # AGENTS.md 托管块里"规则区"最多几行。块是每个会话在每个宿主上都要读一遍的
  # 东西,所以一条规则要进来,得值回后面每一次会话为读它付的钱。
  rule_budget: 7
  # 这个库自己挣来的规则,`magi lint` 和 `sync --close` 会执行它们。词表是封闭的
  # (见 core/rules.py):require_field / field_points_into / forbid_transition /
  # max_open_per_line / leaving_status_requires_post_by。每条带 `from:`,指回
  # 那条被采纳的提案——一条追溯不到出处的规则,是一条没人能反驳、因而也没人能
  # 退掉的规则。`magi reflect promote` 加,`magi reflect retire` 删。
  rules: []
  # 内置宿主表之外的 agent CLI。世上的 CLI 太多，列不完，所以「宿主」是一条
  # 记录：bin、skill 落点、无头调用模板、模型参数。记录里唯一写不了的是怎么读
  # 这个 CLI 存下来的会话——各家存法不一样，那需要解析器不是模板；没有 reader
  # 的宿主只是不给慢回路贡献会话，别的照常。key 撞上内置的就整条替换。
  # 字段和写法见 `magi guide` 里的宿主表一节。
  hosts: []
  # Other registered libraries this project's searches reach. Empty = just
  # this one. The registry's `enabled` flag says a library *may* be read;
  # this says which ones this project actually reads.
  search_projects: []

# 向量化用哪个服务(magi index / magi search / magi link 共用)
embedding:
  # ollama = 本机(默认);openai = 任何 OpenAI 兼容的云端接口
  provider: ollama
  # provider: openai 时才用得上。留空则沿用 models.embedding。
  base_url:
  model:
  # 云端接口的 key。环境变量 MAGI_EMBEDDING_API_KEY 优先于这里——
  # 写进本文件的密钥是一个躺在 git 里的密钥。
  # 刻意不写在这里,而不是留空。配置是逐键覆盖的,一个显式的 "" 也是一个值,
  # 会盖掉你在 ~/.config/magi/config.yaml 里设过一次的 key,然后每个新工作区
  # 都连不上云端接口而看不出原因。要用就写进用户级文件,或者用环境变量。
  # api_key: ""

# OCR 处理参数
ocr:
  # MinerU 云端 API 配置（可选，公式/版面质量更高）。
  #
  # Token 刻意不写在这里，而不是留一个空值。配置是逐键覆盖的，一个显式的 ""
  # 也是一个值：它会盖掉你在 ~/.config/magi/config.yaml 里设过一次的 Token，
  # 于是在这个目录下跑 magi 就会连不上 MinerU，而且看不出原因。Token 放用户级
  # 文件里设一次，全机通用；只有想给某个课题用不同的 Token 时，才在那个工作区
  # 的 config.yaml 里取消注释。
  #
  # （magi init 生成的工作区模板早就是这么写的，这里是把同一条规则补齐。）
  # mineru_api_token: ""   # 从 https://mineru.net 获取
  #
  # 有 Token 时走 MinerU，没有时 wiki_ingest 自动回退到本地/原生 OCR 路径。
  use_mineru: true

  # 每次 OCR 的超时时间（秒）
  timeout: 180
  # 图片 DPI 设置
  # 130 经基准测试：与 150 内容一致（仅 LaTeX 风格差异），速度更快；
  # 低于 110 会在密集公式/小下标页面出现误识别，勿降低。
  dpi: 130

# 语义链接参数
semantic_link:
  # 注入链接的相似度阈值
  threshold: 0.75
  # 合并建议的相似度阈值
  merge_threshold: 0.85
  # 自动合并的相似度阈值
  auto_merge_threshold: 0.95

# 外部工具路径（留空则自动查找 PATH 和系统常见路径）
# 也可通过同名环境变量覆盖（PDFTOPPM_PATH, PDFIMAGES_PATH 等）
tools:
  pdftoppm_path: ""
  pdfimages_path: ""
  pandoc_path: ""
  pandoc_crossref_path: ""

# PDF 处理
pdf:
  # 输出图片格式
  image_format: "png"
  # 图片质量
  quality: 100

# 输出设置
output:
  # 是否保留中间图片文件
  keep_temp_images: false
  # 图片输出子文件夹名称
  image_folder: "images"
  # Markdown 文件编码
  encoding: "utf-8"

# 文献雷达（magi radar）
radar:
  # Semantic Scholar 的 key 是免费的(semanticscholar.org/product/api 上申请)。
  # 不填照样跑:不带 key 是和全世界共享一个匿名配额,带了是每端点每秒一次的
  # 独立配额。所以它不是为了更快,是为了别在高峰期被别人的流量拖垮。
  # 环境变量优先。刻意不在这里留空值——显式的 "" 会盖掉用户级配置里的 key。
  s2_api_key_env: SEMANTIC_SCHOLAR_API_KEY
  # s2_api_key: ""
  # arXiv 分类（核心 + 次级）
  arxiv_categories:
    - cond-mat.str-el
    - hep-th
    - quant-ph
    - cond-mat.mes-hall
  # 种子论文（S2 推荐的正样本；library 里的 arXiv ID 会自动并入）
  seed_arxiv_ids:
    - "2606.25340"   # Fractionalized Vortices / KT transitions (Ye group 2026)
    - "2606.03582"   # Fracton Topological Holography
    - "2605.13379"   # Non-Uniform Cellular Automata
    - "2601.01523"   # Non-invertible symmetries in twisted BF TQFTs
  # arXiv 新文回溯天数
  days: 7
  # 单次 harvest 最多产出候选数
  max_candidates: 40
  # 相关度阈值:低于此分的候选被丢弃。留空 = 不过滤(默认)。
  # 实测参考:一个 67 篇的真实文库,四十个候选全部落在 0.55-0.70;明显无关
  # 的文本要低得多(通用凝聚态 0.45、机器学习 0.37、乱码 0.31)。所以这是个
  # 排序信号而不是概率——设一个「安全」的阈值等于什么都不过滤,设一个真能
  # 过滤的阈值会切掉真命中。
  min_relevance:
  # 第三条腿:对 Semantic Scholar 全库做关键词检索。前两条腿结构上只能看新
  # 东西——S2 推荐固定 60 天窗口,arXiv 那条读的是滚动列表——所以一篇去年发
  # 表、正好在题上的论文,是任何次数的收割都碰不到的。这条能碰到。
  # 留空 = 这条腿关闭(默认)。查询语句是一份「我在找什么」的声明,从文库里
  # 猜一份出来只会产出自信的噪音。
  bulk_queries: []
  #   - "fracton topological order"
  #   - "non-invertible symmetry"
  # 年份范围,交给 S2 的 year 参数,例如 "2023-" 或 "2020-2024"。留空 = 不限。
  bulk_years:
  # 我方已发表论文（citation-gap 侦察的锚点；默认回退到 seed_arxiv_ids）
  own_arxiv_ids:
    - "2606.25340"
    - "2606.03582"
    - "2605.13379"
    - "2601.01523"
    - "2401.00505"   # Higher-Order Cellular Automata SPT, PRX Quantum 5 (2024)
  citation_gap:
    # 候选需与我方论文共享的最少参考文献数（共引信号）
    min_shared_refs: 2
    # 只看最近 N 年的论文
    years: 2
