[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "magi-research"
version = "2.7.1"
description = "MAGI: agent-native research workspace — knowledge base, retrieval, and literature radar for CLI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Misaka16384" }]
keywords = ["research", "knowledge-base", "agent", "cli", "retrieval", "rag",
            "literature", "obsidian", "academic", "wiki"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "pyyaml>=6.0",
    "filelock>=3.12.0",
    "requests>=2.28.0",
    "pillow>=9.0.0",
    "pymupdf>=1.22.0",
    "rich>=13.0.0",
    "scikit-learn>=1.0.0",
    "numpy>=1.20.0",
    "pylatexenc>=2.10",
    "sqlite-vec>=0.1.6",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
]

[project.optional-dependencies]
# `starlette.testclient` now requires httpx2; a fresh environment has neither
# it nor pytest, so the test job installs this extra rather than a hand-kept
# list in the workflow.
test = ["pytest>=8.0", "httpx2>=2.0"]

# Reading a PDF's own text layer instead of OCR-ing it. Optional because it is
# not free: pymupdf4llm pulls pymupdf_layout, which pulls onnxruntime. The
# *detection* half — deciding whether a PDF even has a usable text layer, which
# saves a MinerU token or a GPU minute — runs on PyMuPDF alone and is always on.
#
# The onnxruntime floor is ours to declare because nobody else does:
# pymupdf_layout requires a bare `onnxruntime` with no version specifier at
# all, so pip is free to leave a years-old one in place next to the models it
# ships. Measured: onnxruntime 1.15.1 raises `Fail: Unsupported model IR
# version: 10, max supported IR version: 9` on import, which is not an
# ImportError and took `ingest auto` down with it. IR 10 is ONNX 1.16, and
# onnxruntime 1.18.0 is the first release to bundle it.
#
# No upper bound, deliberately. onnxruntime 1.28 raised its own
# `requires_python` to >=3.11 while this project's floor is 3.10, so a resolver
# on 3.10 already declines it and settles on the newest 1.27.x — measured:
# 1.23.2 on a fresh 3.10 environment. Capping would pin 3.11+ users to a
# version nothing says is broken, on a guess. The floor is here because a
# release was measured failing; there is no such measurement above.
textlayer = ["pymupdf4llm>=0.0.17", "onnxruntime>=1.18"]

[project.urls]
Homepage = "https://github.com/Misaka16384/magi"
Repository = "https://github.com/Misaka16384/magi"
Issues = "https://github.com/Misaka16384/magi/issues"
Changelog = "https://github.com/Misaka16384/magi/releases"

[project.scripts]
magi = "magi.cli:main"

# Dry-run target: uv publish --index testpypi
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"magi" = ["docs/*.md", "skills/*/SKILL.md", "skills/*/templates/*.md"]
"magi.ingest.ocr" = ["Modelfile*", "*.md"]
"magi.ui" = ["static/*", "static/**/*"]

